model: division_i_weighted_v4
engine: WeeklySeasonRankingEngine
version: 6
scope:
  ranking_pool: NCAA_Division_I
  subdivisions: [FBS, FCS]
  publish_fbs_rankings: true
  publish_fcs_rankings: true

season_reset:
  previous_season_rankings: forbidden
  previous_season_statistics: forbidden
  preseason_poll_seed: forbidden
  preseason_power_rating_seed: forbidden
  conference_strength: forbidden

weekly_flow:
  publish_preseason_ranking: false
  first_published_ranking: week_1_complete
  pre_week_1_state: all_teams_tied_for_1
  provider_week_0_maps_to_ranking_week_1: true
  unplayed_team_scoring_rank: neutral_until_first_completed_game
  week_1_scoring_rank: average_occupied_rank_of_full_pool
  week_1_scoring_rank_formula: (N_plus_1)_div_2
  week_2_and_later_opponent_rank_source: previous_completed_week_current_season
  exact_score_ties_use: average_occupied_rank_for_next_week_scoring
  retroactive_revalue_old_games: false
  same_week_recursive_recalculation: false

scoring:
  win_bonus: 0
  division_i_margin_scale: 1.0
  road_win_bonus: 7
  home_loss_penalty: 7
  home_win_adjustment: 0
  away_loss_adjustment: 0
  neutral_site_adjustment: 0
  out_of_pool_margin_scale: 0.5
  loss_rank_penalty: true
  opponent_win_rule: N_plus_1_minus_R
  opponent_loss_rule: negative_R
  conference_weight: 0
  previous_season_weight: 0
  preseason_weight: 0

fcs_scoring_modifier:
  fbs_vs_fbs: 1.0
  fbs_vs_fcs: 1.0
  fcs_vs_fcs: 0.5
  fcs_loss_to_fbs: 0.5
  fcs_win_over_fbs: 1.0
  fcs_tie_with_fbs: 0.5
  applies_to_components: [opponent_rank_points, margin_points]
  site_adjustment_applied_after_multiplier: true

classification_rule:
  in_rank_pool: [FBS, FCS]
  out_of_rank_pool: [Division_II, Division_III, NAIA, other]
