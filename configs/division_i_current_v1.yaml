# Authoritative production alias for v0.3.1.
# This file mirrors the live policy in current_season_v1.yaml with a scope-first name.
model: division_i_weighted_v1
engine: WeeklySeasonRankingEngine
version: 2

scope:
  ranking_pool: NCAA_Division_I
  subdivisions: [FBS, FCS]

season_reset:
  prior_season_carryover: false
  preseason_seed: false
  conference_strength: false

weekly_flow:
  preseason_ranking: false
  week_1_opponent_rank_points: 0
  later_week_rank_source: previous_completed_week_current_season
  same_week_recursion: false
  retroactive_rescoring: false

scoring:
  win_bonus: 10
  in_pool_margin_scale: 1.0
  out_of_pool_margin_scale: 0.5
  win_opponent_rule: N_plus_1_minus_R
  loss_opponent_rule: negative_R

fcs_scoring_modifier:
  fbs_team_any_division_i_opponent: 1.0
  fcs_vs_fcs: 0.5
  fcs_loss_to_fbs: 0.5
  fcs_win_over_fbs: 1.0
  fcs_tie_with_fbs: 0.5
  applies_to_components: [opponent_rank_points, win_points, margin_points]
