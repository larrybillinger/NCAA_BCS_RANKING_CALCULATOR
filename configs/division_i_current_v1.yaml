# Authoritative production alias for the current Division I model.
# This file mirrors the live policy in current_season_v1.yaml with a scope-first name.
model: division_i_weighted_v5
engine: WeeklySeasonRankingEngine
version: 6

scope:
  ranking_pool: NCAA_Division_I
  subdivisions: [FBS, FCS]

season_reset:
  prior_season_carryover: false
  preseason_seed: false
  conference_strength: false

weekly_flow:
  preseason_ranking: false
  pre_week_1_state: all_teams_tied_for_1
  provider_week_0_maps_to_ranking_week_1: true
  unplayed_team_scoring_rank: neutral_until_first_completed_game
  week_1_scoring_rank: average_occupied_rank_of_full_pool
  later_week_rank_source: previous_completed_week_current_season
  exact_score_ties_use: average_occupied_rank_for_next_week_scoring
  same_week_recursion: false
  retroactive_rescoring: false
  season_ranking_value: average_frozen_game_score
  bye_week_effect_on_ranking_average: none

scoring:
  win_bonus: 0
  in_pool_margin_scale: 1.0
  road_win_bonus: 7
  home_loss_penalty: 7
  home_win_adjustment: 0
  away_loss_adjustment: 0
  neutral_site_adjustment: 0
  out_of_pool_margin_scale: 0.5
  win_opponent_rule: N_plus_1_minus_R
  loss_opponent_rule: negative_R

fcs_scoring_modifier:
  fbs_vs_fbs: 1.0
  fbs_vs_fcs: 1.0
  fcs_vs_fcs: 0.5
  fcs_loss_to_fbs: 0.5
  fcs_win_over_fbs: 1.0
  fcs_tie_with_fbs: 0.5
  applies_to_components: [opponent_rank_points, margin_points]
  site_adjustment_applied_after_multiplier: true

season_aggregation:
  ranking_score: sum_frozen_game_scores_divided_by_games_played
  raw_game_score_total: audit_only
  tie_breakers: [head_to_head, win_percentage, average_opponent_strength, deterministic_team_name]
